<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mystic Item DB — Component Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { pixel: ['"Press Start 2P"', 'monospace'], sans: ['Inter', 'system-ui', 'sans-serif'] } } },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #020617;
      background-image:
        linear-gradient(rgba(2, 6, 23, 0.96), rgba(2, 6, 23, 0.96)),
        url("data:image/svg+xml,%3Csvg width='32' height='32' viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 31h32M31 0v32' stroke='%231e293b' stroke-opacity='0.5' stroke-width='1'/%3E%3C/svg%3E");
    }
    .pixel-title { text-shadow: 2px 2px 0 #f43f5e; }
    .mc-icon { image-rendering: pixelated; image-rendering: crisp-edges; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast-anim { animation: slideIn 0.25s ease; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
  </style>
</head>
<body class="font-sans text-slate-200 min-h-screen antialiased">
  <div class="mx-auto max-w-7xl px-3 sm:px-6 py-6">
    <header class="text-center px-2 pt-6 pb-4">
      <div class="flex items-center justify-center gap-3 mb-2">
        <span class="text-3xl sm:text-4xl">🧩</span>
        <h1 class="font-pixel text-amber-300 pixel-title text-xs sm:text-base md:text-lg leading-relaxed">Component Builder</h1>
      </div>
      <p class="text-slate-400 text-sm sm:text-base">Build your own item pack and export it as a component</p>
      <div class="flex justify-center flex-wrap gap-2 mt-5">
        <a href="../" class="rounded-lg border-2 border-slate-700 px-3 py-1.5 text-xs sm:text-sm font-semibold text-slate-200 hover:border-emerald-400 hover:text-emerald-300 transition">← Back</a>
        <a href="../admin/" class="rounded-lg border-2 border-slate-700 px-3 py-1.5 text-xs sm:text-sm font-semibold text-slate-200 hover:border-emerald-400 hover:text-emerald-300 transition">⛏️ Admin</a>
        <button type="button" id="import-btn" class="rounded-lg border-2 border-slate-700 px-3 py-1.5 text-xs sm:text-sm font-semibold text-slate-200 hover:border-emerald-400 hover:text-emerald-300 transition">📥 Import Component</button>
        <button type="button" id="export-btn" class="rounded-lg bg-emerald-500 px-3 py-1.5 text-xs sm:text-sm font-semibold text-slate-950 hover:bg-emerald-400 transition">💾 Export Component</button>
        <button type="button" id="clear-btn" class="rounded-lg border-2 border-slate-700 px-3 py-1.5 text-xs sm:text-sm font-semibold text-slate-200 hover:border-rose-500 hover:text-rose-300 transition">🗑 Clear All</button>
        <input type="file" id="import-file" accept="application/json,.json" class="hidden">
      </div>
    </header>

    <main class="space-y-5 mt-4">
      <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl">
        <h2 class="text-emerald-300 font-semibold text-base sm:text-lg mb-3">Component Info</h2>
        <div class="flex flex-col gap-1.5">
          <label for="component-name" class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Component Name</label>
          <input type="text" id="component-name" placeholder="e.g. Netherite Gear Pack"
            class="bg-slate-950 border-2 border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-rose-500 transition">
        </div>
      </section>

      <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl">
        <h2 id="form-title" class="text-emerald-300 font-semibold text-base sm:text-lg mb-4">Add Item</h2>
        <form id="item-form">
          <input type="hidden" id="edit-id">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-3">
            <div class="flex flex-col gap-1.5">
              <label for="item-name" class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Item Name</label>
              <input type="text" id="item-name" required placeholder="e.g. Diamond"
                class="bg-slate-950 border-2 border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-rose-500 transition">
            </div>
            <div class="flex flex-col gap-1.5">
              <label for="item-category" class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Category</label>
              <input type="text" id="item-category" list="category-list" value="Misc"
                class="bg-slate-950 border-2 border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-rose-500 transition">
              <datalist id="category-list"></datalist>
            </div>
            <div class="flex flex-col gap-1.5">
              <label for="price-per-item" class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Price per Item</label>
              <input type="number" id="price-per-item" min="0" step="0.01" required placeholder="0.00"
                class="bg-slate-950 border-2 border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder:text-slate-600 focus:outline-none focus:border-rose-500 transition">
            </div>
            <div class="flex flex-col gap-1.5">
              <label for="stack-size" class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Stack Size</label>
              <input type="number" id="stack-size" value="64" min="1" max="9999"
                class="bg-slate-950 border-2 border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-rose-500 transition">
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="flex flex-col gap-1.5">
              <label class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Item Icon</label>
              <div id="drop-zone" class="relative flex items-center justify-center min-h-[120px] rounded-lg border-2 border-dashed border-slate-700 bg-slate-950 cursor-pointer overflow-hidden hover:border-rose-500 transition">
                <input type="file" id="item-icon" accept="image/png,image/jpeg,image/gif,image/webp" class="absolute inset-0 opacity-0 cursor-pointer z-10">
                <div id="upload-placeholder" class="flex flex-col items-center gap-1 p-4 text-center pointer-events-none">
                  <span class="text-2xl">📁</span>
                  <span class="text-sm text-slate-300">Drop texture or click</span>
                  <span class="text-xs text-slate-500">PNG, JPG, GIF, WebP</span>
                </div>
                <img id="icon-preview" class="mc-icon hidden w-16 h-16 object-contain relative z-0" alt="">
              </div>
            </div>
            <div class="flex flex-col gap-1.5">
              <label class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Price Preview</label>
              <div class="flex flex-col justify-center gap-2 rounded-lg border-2 border-slate-700 bg-slate-950 px-4 py-3 min-h-[120px]">
                <div class="flex justify-between items-center">
                  <span class="text-sm text-slate-400">Per Item</span>
                  <span class="font-bold text-amber-300 tabular-nums" id="preview-item">—</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-sm text-slate-400">Half Stack <small id="preview-half-count" class="text-slate-500">(32)</small></span>
                  <span class="font-bold text-amber-300 tabular-nums" id="preview-half">—</span>
                </div>
                <div class="flex justify-between items-center">
                  <span class="text-sm text-slate-400">Full Stack <small id="preview-full-count" class="text-slate-500">(64)</small></span>
                  <span class="font-bold text-amber-300 tabular-nums" id="preview-full">—</span>
                </div>
              </div>
            </div>
          </div>
          <div class="flex flex-wrap gap-2 mt-4">
            <button type="submit" id="submit-btn" class="rounded-lg bg-rose-500 px-5 py-2.5 text-sm font-semibold text-white hover:bg-rose-400 active:scale-95 transition">Add Item</button>
            <button type="button" id="cancel-btn" class="hidden rounded-lg bg-slate-700 px-5 py-2.5 text-sm font-semibold text-slate-100 hover:bg-slate-600 active:scale-95 transition">Cancel</button>
          </div>
        </form>
      </section>

      <section class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl">
        <div class="flex flex-col xl:flex-row xl:items-center gap-3 justify-between mb-4">
          <h2 class="text-emerald-300 font-semibold text-base sm:text-lg shrink-0">Items
            <span id="item-count" class="ml-1 inline-flex items-center justify-center rounded-full bg-rose-500 px-2 py-0.5 text-xs font-bold text-white align-middle">0</span>
          </h2>
          <div class="flex flex-col sm:flex-row gap-2 sm:items-center w-full xl:w-auto">
            <input type="text" id="search" placeholder="🔍 Search items…"
              class="w-full sm:w-56 bg-slate-950 border-2 border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-rose-500 transition">
            <div class="flex items-center gap-2">
              <label for="sort-field" class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 shrink-0">Sort</label>
              <select id="sort-field" class="flex-1 sm:flex-none bg-slate-950 border-2 border-slate-700 rounded-lg px-2 py-2 text-sm text-slate-100 focus:outline-none focus:border-rose-500 cursor-pointer">
                <option value="name">Name</option>
                <option value="price">Price</option>
                <option value="category">Category</option>
              </select>
              <button type="button" id="sort-direction" class="rounded-lg bg-slate-950 border-2 border-slate-700 px-3 py-2 text-sm font-semibold text-slate-200 hover:border-emerald-400 hover:text-emerald-300 transition min-w-[76px]">↑ Asc</button>
            </div>
          </div>
        </div>
        <div id="category-filters" class="flex flex-wrap gap-1.5 mb-4"></div>
        <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-3"></div>
      </section>

      <footer class="text-center py-4 text-xs text-slate-500">
        <p>Auto-saved in browser · Export here, then import the file in the <a href="../admin/" class="text-emerald-300 hover:underline">admin panel</a></p>
      </footer>
    </main>
  </div>
  <div id="toast-container" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50 max-w-[calc(100vw-2rem)]"></div>

  <script>
    const STORAGE_KEY = 'mystic-item-component-draft';
    const DEFAULT_CATEGORIES = ['Blocks', 'Tools', 'Food', 'Resources', 'Redstone', 'Misc'];

    let items = [];
    let categories = [...DEFAULT_CATEGORIES];
    let editingId = null;
    let editingIconData = null;
    let activeCategory = '';
    let sortDirection = 'asc';

    const componentNameInput = document.getElementById('component-name');
    const form = document.getElementById('item-form');
    const formTitle = document.getElementById('form-title');
    const editIdInput = document.getElementById('edit-id');
    const nameInput = document.getElementById('item-name');
    const categoryInput = document.getElementById('item-category');
    const categoryList = document.getElementById('category-list');
    const priceInput = document.getElementById('price-per-item');
    const stackInput = document.getElementById('stack-size');
    const iconInput = document.getElementById('item-icon');
    const dropZone = document.getElementById('drop-zone');
    const uploadPlaceholder = document.getElementById('upload-placeholder');
    const iconPreview = document.getElementById('icon-preview');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const itemsGrid = document.getElementById('items-grid');
    const itemCount = document.getElementById('item-count');
    const searchInput = document.getElementById('search');
    const categoryFilters = document.getElementById('category-filters');
    const sortFieldSelect = document.getElementById('sort-field');
    const sortDirectionBtn = document.getElementById('sort-direction');

    const CHIP_BASE = 'rounded-full border-2 px-3 py-1 text-xs font-medium transition cursor-pointer whitespace-nowrap';
    const CHIP_IDLE = 'bg-slate-950 border-slate-700 text-slate-400 hover:border-rose-500 hover:text-slate-200';
    const CHIP_ACTIVE = 'bg-emerald-500 border-emerald-500 text-slate-950 font-semibold';

    function uuid() { return crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2); }
    function formatPrice(v) {
      if (v == null || isNaN(v)) return '—';
      const abs = Math.abs(v);
      const units = [[1e9, 'B'], [1e6, 'M'], [1e3, 'k']];
      for (const [threshold, suffix] of units) {
        if (abs >= threshold) {
          const rounded = Math.round((v / threshold) * 10) / 10;
          return rounded.toString() + suffix;
        }
      }
      return v.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }
    function formatFull(v) {
      if (v == null || isNaN(v)) return '—';
      return v.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }
    function calcPrices(p, s) { const h = Math.floor(s / 2); return { perItem: p, halfStack: p * h, fullStack: p * s, halfCount: h, fullCount: s }; }
    function getCat(item) { return item.category || 'Misc'; }
    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

    function showToast(msg, type = 'success') {
      const t = document.createElement('div');
      const border = type === 'error' ? 'border-rose-500' : 'border-emerald-400';
      t.className = `toast-anim bg-slate-900 border-2 ${border} rounded-xl px-4 py-2.5 text-sm text-slate-100 shadow-xl`;
      t.textContent = msg;
      document.getElementById('toast-container').appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    function ensureCategory(name) {
      const t = (name || 'Misc').trim();
      if (!categories.some(c => c.toLowerCase() === t.toLowerCase())) {
        categories.push(t);
        categories.sort((a, b) => a.localeCompare(b));
      }
      return categories.find(c => c.toLowerCase() === t.toLowerCase()) || t;
    }

    function saveDraft() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ componentName: componentNameInput.value.trim(), categories, items }));
    }

    function loadDraft() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!data) return;
        componentNameInput.value = data.componentName || '';
        categories = Array.isArray(data.categories) && data.categories.length ? data.categories : [...DEFAULT_CATEGORIES];
        items = Array.isArray(data.items) ? data.items : [];
      } catch { /* ignore */ }
    }

    function updatePricePreview() {
      const price = parseFloat(priceInput.value);
      const stack = parseInt(stackInput.value, 10) || 64;
      const p = isNaN(price) ? null : calcPrices(price, stack);
      document.getElementById('preview-item').textContent = p ? formatPrice(p.perItem) : '—';
      document.getElementById('preview-half').textContent = p ? formatPrice(p.halfStack) : '—';
      document.getElementById('preview-full').textContent = p ? formatPrice(p.fullStack) : '—';
      document.getElementById('preview-item').title = p ? formatFull(p.perItem) : '';
      document.getElementById('preview-half').title = p ? formatFull(p.halfStack) : '';
      document.getElementById('preview-full').title = p ? formatFull(p.fullStack) : '';
      document.getElementById('preview-half-count').textContent = '(' + Math.floor(stack / 2) + ')';
      document.getElementById('preview-full-count').textContent = '(' + stack + ')';
    }

    function setPreviewSrc(src) {
      if (!src) {
        iconPreview.classList.add('hidden');
        iconPreview.removeAttribute('src');
        uploadPlaceholder.classList.remove('hidden');
        return;
      }
      iconPreview.src = src;
      iconPreview.classList.remove('hidden');
      uploadPlaceholder.classList.add('hidden');
    }

    function resetForm() {
      editingId = null;
      editingIconData = null;
      form.reset();
      stackInput.value = '64';
      categoryInput.value = 'Misc';
      editIdInput.value = '';
      formTitle.textContent = 'Add Item';
      submitBtn.textContent = 'Add Item';
      cancelBtn.classList.add('hidden');
      setPreviewSrc(null);
      updatePricePreview();
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    function getFilteredItems() {
      const q = searchInput.value.toLowerCase().trim();
      return items.filter(i => (!q || i.name.toLowerCase().includes(q)) && (!activeCategory || getCat(i) === activeCategory));
    }

    function sortItems(list) {
      const field = sortFieldSelect.value;
      const mult = sortDirection === 'asc' ? 1 : -1;
      return [...list].sort((a, b) => {
        let cmp = 0;
        if (field === 'price') cmp = a.pricePerItem - b.pricePerItem;
        else if (field === 'category') { cmp = getCat(a).localeCompare(getCat(b)); if (!cmp) cmp = a.name.localeCompare(b.name); }
        else cmp = a.name.localeCompare(b.name);
        return cmp * mult;
      });
    }

    function renderCategoryDatalist() {
      categoryList.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">`).join('');
    }

    function renderCategoryFilters() {
      const counts = {};
      items.forEach(i => { const c = getCat(i); counts[c] = (counts[c] || 0) + 1; });
      const all = [...new Set([...categories, ...Object.keys(counts)])].sort((a, b) => a.localeCompare(b));
      categoryFilters.innerHTML =
        `<button type="button" class="${CHIP_BASE} ${activeCategory === '' ? CHIP_ACTIVE : CHIP_IDLE}" data-category="">All<span class="opacity-70 ml-1">(${items.length})</span></button>` +
        all.filter(c => counts[c]).map(c =>
          `<button type="button" class="${CHIP_BASE} ${activeCategory === c ? CHIP_ACTIVE : CHIP_IDLE}" data-category="${escapeHtml(c)}">${escapeHtml(c)}<span class="opacity-70 ml-1">(${counts[c]})</span></button>`
        ).join('');
    }

    function iconHtml(item) {
      const initial = escapeHtml((item.name || '?').charAt(0).toUpperCase());
      if (!item.iconData) {
        return `<span class="flex items-center justify-center w-10 h-10 rounded-md bg-slate-800 text-lg font-bold text-slate-500">${initial}</span>`;
      }
      return `<img src="${item.iconData}" alt="" loading="lazy" class="mc-icon w-10 h-10 object-contain"
        onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <span style="display:none" class="items-center justify-center w-10 h-10 rounded-md bg-slate-800 text-lg font-bold text-slate-500">${initial}</span>`;
    }

    function renderItems() {
      itemCount.textContent = items.length;
      renderCategoryDatalist();
      renderCategoryFilters();
      const filtered = sortItems(getFilteredItems());
      const hasFilters = searchInput.value.trim() || activeCategory;

      if (!filtered.length) {
        itemsGrid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><span class="block text-4xl mb-3">${hasFilters ? '🔍' : '🗃️'}</span><p class="text-sm">${hasFilters ? 'No items match your filters.' : 'No items yet. Add your first item above.'}</p></div>`;
        return;
      }

      itemsGrid.innerHTML = filtered.map(item => {
        const p = calcPrices(item.pricePerItem, item.stackSize);
        return `<article class="flex flex-col gap-3 rounded-xl border-2 border-slate-700/60 bg-slate-800/60 p-4 transition hover:-translate-y-0.5 hover:border-emerald-400/60 hover:shadow-xl">
          <div class="flex items-center gap-3 min-w-0">
            <div class="flex items-center justify-center w-14 h-14 rounded-lg bg-slate-950/80 border-2 border-slate-700/60 shrink-0 overflow-hidden">${iconHtml(item)}</div>
            <div class="min-w-0"><div class="font-bold text-[15px] leading-tight text-slate-100 break-words">${escapeHtml(item.name)}</div>
            <span class="inline-block rounded-full border border-emerald-400/60 bg-emerald-400/10 px-2 py-0.5 mt-1 text-[10px] font-semibold uppercase tracking-wider text-emerald-300">${escapeHtml(getCat(item))}</span></div>
          </div>
          <div class="grid grid-cols-3 gap-1.5">
            <div class="rounded-lg bg-slate-950/60 p-2 text-center"><span class="block text-[10px] uppercase tracking-wider text-slate-400 mb-0.5">Per Item</span><span class="block font-bold text-[13px] text-amber-300 tabular-nums" title="${formatFull(p.perItem)}">${formatPrice(p.perItem)}</span></div>
            <div class="rounded-lg bg-slate-950/60 p-2 text-center"><span class="block text-[10px] uppercase tracking-wider text-slate-400 mb-0.5">Half (${p.halfCount})</span><span class="block font-bold text-[13px] text-amber-300 tabular-nums" title="${formatFull(p.halfStack)}">${formatPrice(p.halfStack)}</span></div>
            <div class="rounded-lg bg-slate-950/60 p-2 text-center"><span class="block text-[10px] uppercase tracking-wider text-slate-400 mb-0.5">Stack (${p.fullCount})</span><span class="block font-bold text-[13px] text-amber-300 tabular-nums" title="${formatFull(p.fullStack)}">${formatPrice(p.fullStack)}</span></div>
          </div>
          <div class="flex gap-2 mt-auto">
            <button type="button" class="flex-1 rounded-lg border border-emerald-400/70 px-3 py-1.5 text-xs font-semibold text-emerald-300 hover:bg-emerald-400 hover:text-slate-950 transition" data-action="edit" data-id="${item.id}">Edit</button>
            <button type="button" class="flex-1 rounded-lg border border-rose-500/70 px-3 py-1.5 text-xs font-semibold text-rose-400 hover:bg-rose-500 hover:text-white transition" data-action="delete" data-id="${item.id}">Delete</button>
          </div>
        </article>`;
      }).join('');
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const price = parseFloat(priceInput.value);
      if (isNaN(price) || price < 0) { showToast('Enter a valid price', 'error'); return; }

      let iconData = editingIconData;
      if (iconInput.files[0]) iconData = await readFileAsDataUrl(iconInput.files[0]);

      const payload = {
        id: editingId || uuid(),
        name: nameInput.value.trim(),
        category: ensureCategory(categoryInput.value),
        pricePerItem: price,
        stackSize: parseInt(stackInput.value, 10) || 64,
        iconData: iconData || null,
        createdAt: editingId ? items.find(i => i.id === editingId)?.createdAt : new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      };

      if (editingId) {
        const idx = items.findIndex(i => i.id === editingId);
        if (idx !== -1) items[idx] = payload;
        showToast('"' + payload.name + '" updated');
      } else {
        items.push(payload);
        showToast('"' + payload.name + '" added');
      }

      saveDraft();
      resetForm();
      renderItems();
    }

    function startEdit(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      editingId = id;
      editingIconData = item.iconData || null;
      editIdInput.value = id;
      nameInput.value = item.name;
      categoryInput.value = getCat(item);
      priceInput.value = item.pricePerItem;
      stackInput.value = item.stackSize;
      formTitle.textContent = 'Edit Item';
      submitBtn.textContent = 'Save Changes';
      cancelBtn.classList.remove('hidden');
      iconInput.value = '';
      setPreviewSrc(item.iconData);
      updatePricePreview();
      form.scrollIntoView({ behavior: 'smooth' });
    }

    function deleteItem(id) {
      const item = items.find(i => i.id === id);
      if (!item || !confirm('Delete "' + item.name + '"?')) return;
      items = items.filter(i => i.id !== id);
      if (editingId === id) resetForm();
      saveDraft();
      renderItems();
      showToast('"' + item.name + '" deleted');
    }

    function buildComponent() {
      return {
        version: 1,
        type: 'mystic-item-component',
        componentName: componentNameInput.value.trim() || 'Unnamed Component',
        exportedAt: new Date().toISOString(),
        categories: [...categories],
        items: items.map(({ id, name, category, pricePerItem, stackSize, iconData, createdAt, updatedAt }) =>
          ({ id, name, category, pricePerItem, stackSize, iconData, createdAt, updatedAt })),
      };
    }

    function exportComponent() {
      if (!items.length) { showToast('Add at least one item before exporting', 'error'); return; }
      const data = buildComponent();
      const slug = (data.componentName || 'component').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = slug + '.component.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Component exported (' + items.length + ' items)');
    }

    async function importComponentFile(file) {
      try {
        const data = JSON.parse(await file.text());
        if (data.type !== 'mystic-item-component' || !Array.isArray(data.items)) {
          showToast('Invalid component file', 'error');
          return;
        }
        if (items.length && !confirm('Replace your current draft with "' + (data.componentName || 'component') + '"?')) return;
        componentNameInput.value = data.componentName || '';
        categories = Array.isArray(data.categories) && data.categories.length ? data.categories : [...DEFAULT_CATEGORIES];
        items = data.items;
        activeCategory = '';
        searchInput.value = '';
        resetForm();
        saveDraft();
        renderItems();
        showToast('Component loaded (' + items.length + ' items)');
      } catch {
        showToast('Invalid JSON file', 'error');
      } finally {
        document.getElementById('import-file').value = '';
      }
    }

    function clearAll() {
      if (items.length && !confirm('Clear all items and start fresh?')) return;
      items = [];
      categories = [...DEFAULT_CATEGORIES];
      componentNameInput.value = '';
      activeCategory = '';
      searchInput.value = '';
      resetForm();
      saveDraft();
      renderItems();
      showToast('Draft cleared');
    }

    iconPreview.addEventListener('error', () => setPreviewSrc(null));
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('!border-rose-500'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('!border-rose-500'));
    dropZone.addEventListener('drop', async e => {
      e.preventDefault();
      dropZone.classList.remove('!border-rose-500');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const dt = new DataTransfer();
        dt.items.add(file);
        iconInput.files = dt.files;
        editingIconData = await readFileAsDataUrl(file);
        setPreviewSrc(editingIconData);
      }
    });
    iconInput.addEventListener('change', async () => {
      if (iconInput.files[0]) {
        editingIconData = await readFileAsDataUrl(iconInput.files[0]);
        setPreviewSrc(editingIconData);
      }
    });
    priceInput.addEventListener('input', updatePricePreview);
    stackInput.addEventListener('input', updatePricePreview);
    componentNameInput.addEventListener('input', saveDraft);
    form.addEventListener('submit', handleSubmit);
    cancelBtn.addEventListener('click', resetForm);
    searchInput.addEventListener('input', renderItems);
    sortFieldSelect.addEventListener('change', renderItems);
    sortDirectionBtn.addEventListener('click', () => {
      sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      sortDirectionBtn.textContent = sortDirection === 'asc' ? '↑ Asc' : '↓ Desc';
      sortDirectionBtn.classList.toggle('!border-emerald-400', sortDirection === 'desc');
      sortDirectionBtn.classList.toggle('!text-emerald-300', sortDirection === 'desc');
      renderItems();
    });
    categoryFilters.addEventListener('click', e => {
      const chip = e.target.closest('[data-category]');
      if (!chip) return;
      activeCategory = chip.dataset.category || '';
      renderItems();
    });
    itemsGrid.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'edit') startEdit(btn.dataset.id);
      if (btn.dataset.action === 'delete') deleteItem(btn.dataset.id);
    });
    document.getElementById('export-btn').addEventListener('click', exportComponent);
    document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
    document.getElementById('import-file').addEventListener('change', e => { if (e.target.files[0]) importComponentFile(e.target.files[0]); });
    document.getElementById('clear-btn').addEventListener('click', clearAll);

    loadDraft();
    updatePricePreview();
    renderItems();
  </script>
</body>
</html>
